# Manual-only. CI checkouts cannot deploy this app: the deploy kit
# (Dockerfile, fly.toml context, cloud billing layer) lives in the gitignored
# private layer and exists only on the operator's machine — a CI-built image
# would silently ship without billing/auth. Deploys run locally via
# `flyctl deploy --remote-only`. Kept as workflow_dispatch for emergencies
# where a machine with repo secrets configured still wants the button.

name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
